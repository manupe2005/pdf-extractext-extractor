[project]
name = "pdf-extractext-extractor"
version = "0.1.0"
description = "Microservicio de extracción de texto de PDFs (bootstrap inicial)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.119.0",
    "uvicorn[standard]>=0.37.0",
    "pydantic-settings>=2.11.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
